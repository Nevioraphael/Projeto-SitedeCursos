<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <title>Login do sistema</title>
    </head>
    <body>
        <br/>
        <div class="container w-50">
            <h1>Login</h1>
            
            <!-- Mensagem de erro (oculta por padrão) -->
            <div id="erro" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" class="row g-3 needs-validation" novalidate>
                <div class="row pt-4">
                    <div class="col-md-4">
                        <label for="usuario" class="form-label">Usuário</label>
                        <input type="text" class="form-control" id="usuario" name="usuario" required>
                        <div class="invalid-feedback">Informe o usuário!</div>
                    </div>
                </div>
                <div class="row pt-4">
                  <div class="col-md-4">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" class="form-control" id="senha" name="senha" required>
                    <div class="invalid-feedback">Informe a senha!</div>
                  </div>
                </div>
                <div class="row pt-2">
                    <div class="col-12">
                        <button class="btn btn-primary" type="submit">Entrar</button>
                        <button class="btn btn-secondary" type="button" onclick="history.back()">Voltar</button>
                    </div>
                </div>
            </form>
        </div>

        <script>
            // Validação Bootstrap
            const form = document.getElementById('loginForm');
            
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                if (!form.checkValidity()) {
                    e.stopPropagation();
                    form.classList.add('was-validated');
                    return;
                }

                const usuario = document.getElementById('usuario').value;
                const senha = document.getElementById('senha').value;

                try {
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        body: new URLSearchParams({ usuario, senha })
                    });

                    if (response.redirected) {
                        window.location.href = response.url;
                    } else if (!response.ok) {
                        const dados = await response.json();
                        document.getElementById('erro').textContent = dados.erro || 'Erro ao fazer login';
                        document.getElementById('erro').classList.remove('d-none');
                    }
                } catch (error) {
                    console.error('Erro:', error);
                    document.getElementById('erro').textContent = 'Erro ao conectar com o servidor';
                    document.getElementById('erro').classList.remove('d-none');
                }
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
